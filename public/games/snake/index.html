<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Snake</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: Arial, sans-serif;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            text-align: center;
            color: #fff;
        }
        h1 {
            font-size: 48px;
            margin: 20px;
            background: linear-gradient(45deg, #00ff88, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        canvas {
            border: 3px solid #00ff88;
            background: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }
        .info {
            margin-top: 20px;
            font-size: 20px;
        }
        .score { color: #00ff88; font-weight: bold; }
        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
        button {
            background: #00ff88;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SNAKE</h1>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="info">
            Score: <span class="score" id="score">0</span>
        </div>
        <button onclick="location.reload()">New Game</button>
        <div class="controls">
            <p>⬅️ ➡️ ⬆️ ⬇️ Arrow Keys to Move | Eat Food to Grow!</p>
            <p>Don't Hit Walls or Yourself!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        let food = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameRunning = true;
        let gameSpeed = 10;
        let frameCount = 0;

        function update() {
            frameCount++;
            if (frameCount < gameSpeed) return;
            frameCount = 0;

            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameRunning = false;
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameRunning = false;
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                gameSpeed = Math.max(3, gameSpeed - 0.1);
                food = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
            } else {
                snake.pop();
            }

            document.getElementById('score').textContent = score;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#111';
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            ctx.fillStyle = '#00ff88';
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#00ffff';
                } else {
                    ctx.fillStyle = '#00ff88';
                }
                ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }

            ctx.fillStyle = '#ff0080';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && direction.x === 0) { nextDirection = { x: -1, y: 0 }; e.preventDefault(); }
            if (e.key === 'ArrowRight' && direction.x === 0) { nextDirection = { x: 1, y: 0 }; e.preventDefault(); }
            if (e.key === 'ArrowUp' && direction.y === 0) { nextDirection = { x: 0, y: -1 }; e.preventDefault(); }
            if (e.key === 'ArrowDown' && direction.y === 0) { nextDirection = { x: 0, y: 1 }; e.preventDefault(); }
        });

        function gameLoop() {
            update();
            draw();

            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
