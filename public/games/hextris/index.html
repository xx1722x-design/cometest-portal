<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hextris</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: "Arial", sans-serif;
            color: #fff;
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            position: relative;
            width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 0;
            background: linear-gradient(45deg, #00d4ff, #ff00ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .score {
            font-size: 24px;
            color: #00ff88;
            margin-top: 10px;
        }

        .game-board {
            position: relative;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, rgba(255, 0, 255, 0.05) 100%);
            border: 2px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(255, 0, 255, 0.1);
        }

        .center-point {
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            position: absolute;
            z-index: 1;
        }

        .hexagon {
            position: absolute;
            width: 40px;
            height: 40px;
            opacity: 0;
            animation: fall 2s linear forwards;
        }

        .hex-shape {
            width: 100%;
            height: 100%;
            position: relative;
            transform: rotate(30deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #111;
            border-radius: 50%;
        }

        .hexagon.red .hex-shape { background: #ff006e; box-shadow: 0 0 15px #ff006e; }
        .hexagon.blue .hex-shape { background: #00d4ff; box-shadow: 0 0 15px #00d4ff; }
        .hexagon.green .hex-shape { background: #00ff88; box-shadow: 0 0 15px #00ff88; }
        .hexagon.yellow .hex-shape { background: #ffbe0b; box-shadow: 0 0 15px #ffbe0b; color: #111; }
        .hexagon.purple .hex-shape { background: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
        .hexagon.cyan .hex-shape { background: #00ffff; box-shadow: 0 0 15px #00ffff; color: #111; }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translateY(-200px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(200px) rotate(360deg);
            }
        }

        @keyframes rotate-board {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(60deg); }
        }

        .game-board.rotate {
            animation: rotate-board 300ms ease-in-out;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-screen h2 {
            font-size: 48px;
            margin: 20px;
            color: #ff006e;
            text-shadow: 0 0 20px #ff006e;
        }

        .game-over-screen p {
            font-size: 24px;
            color: #00ff88;
            margin: 10px;
        }

        .game-over-screen button {
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            border: none;
            color: #111;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .game-over-screen button:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HEXTRIS</h1>
            <div class="score">Score: <span id="score">0</span></div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="center-point"></div>
            <div class="game-over-screen" id="gameOverScreen">
                <h2>GAME OVER</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>

        <div class="controls">
            <p>← → Arrow Keys to Rotate</p>
            <p>↑ Up Arrow to Drop</p>
        </div>
    </div>

    <script>
        const COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'cyan'];
        const RADIUS = 150;

        let score = 0;
        let gameActive = true;
        let hexagons = [];

        class Hexagon {
            constructor() {
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.angle = 0;
                this.radius = 0;
                this.el = document.createElement('div');
                this.el.className = `hexagon ${this.color}`;
                this.el.innerHTML = `<div class="hex-shape"></div>`;
                document.getElementById('gameBoard').appendChild(this.el);
            }

            update(angle, radius) {
                this.angle = angle;
                this.radius = radius;
                const rad = (angle * Math.PI) / 180;
                const x = Math.cos(rad) * radius;
                const y = Math.sin(rad) * radius;
                this.el.style.left = (150 + x - 20) + 'px';
                this.el.style.top = (150 + y - 20) + 'px';
            }

            remove() {
                this.el.remove();
            }
        }

        let currentHex = new Hexagon();
        let currentAngle = 0;
        let currentRadius = 0;

        function dropHexagon() {
            currentHex.update(currentAngle, currentRadius);
            currentRadius += 20;

            if (currentRadius > RADIUS) {
                endGame();
                return;
            }

            // Check for collisions and merges
            let merged = false;
            for (let hex of hexagons) {
                const dist = Math.hypot(
                    (currentRadius * Math.cos((currentAngle * Math.PI) / 180)) - (hex.radius * Math.cos((hex.angle * Math.PI) / 180)),
                    (currentRadius * Math.sin((currentAngle * Math.PI) / 180)) - (hex.radius * Math.sin((hex.angle * Math.PI) / 180))
                );

                if (dist < 50 && hex.color === currentHex.color) {
                    score += 10;
                    document.getElementById('score').textContent = score;
                    hex.remove();
                    hexagons = hexagons.filter(h => h !== hex);
                    merged = true;
                    break;
                }
            }

            if (!merged) {
                hexagons.push(currentHex);
                currentHex = new Hexagon();
                currentRadius = 0;
            }

            setTimeout(dropHexagon, 100);
        }

        function rotateBoard(direction) {
            currentAngle += direction * 60;
            currentAngle = ((currentAngle % 360) + 360) % 360;
            document.getElementById('gameBoard').classList.add('rotate');
            setTimeout(() => {
                document.getElementById('gameBoard').classList.remove('rotate');
            }, 300);
        }

        function endGame() {
            gameActive = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.add('show');
        }

        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                rotateBoard(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                rotateBoard(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
            }
        });

        dropHexagon();
    </script>
</body>
</html>
