<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2048</title>
    <style>
        html, body {
            margin: 0;
            padding: 20px;
            background: #faf8ef;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
            color: #776e65;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        body {
            margin: 80px 0 0 0;
        }

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            color: #776e65;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .game-container {
            margin: 0 auto;
            position: relative;
            text-align: center;
        }

        .game-message {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.73);
            z-index: 100;
            text-align: center;
            animation: move-up 800ms ease-in-out both;
            animation-delay: 120ms;
        }

        .game-message p {
            font-size: 60px;
            font-weight: bold;
            height: 60px;
            line-height: 60px;
            margin: 222px 0 0 0;
            color: #776e65;
        }

        .game-message .lower {
            color: #f9f6f2;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .game-message a {
            display: inline-block;
            background: #8f7a66;
            border-radius: 3px;
            padding: 15px 20px;
            text-decoration: none;
            color: #f9f6f2;
            height: 40px;
            line-height: 47px;
            margin-top: 50px;
        }

        .game-message a:hover {
            background: #9f8a76;
        }

        .game-message.game-won {
            display: block;
            background: rgba(237, 194, 46, 0.5);
            color: #776e65;
        }

        .game-message.game-over {
            display: block;
            background: rgba(0, 0, 0, 0.5);
            color: #edc22e;
        }

        .game-message.game-won p:last-child,
        .game-message.game-over p:last-child {
            display: none;
        }

        @keyframes move-up {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .grid-container {
            position: relative;
            padding: 15px;
            cursor: default;
            touch-action: none;
            background: #bbada0;
            border-radius: 6px;
            width: 340px;
            height: 340px;
            margin: 0 auto 20px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px;
        }

        .grid-row {
            display: flex;
            gap: 15px;
        }

        .grid-cell {
            width: 70px;
            height: 70px;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
        }

        .tile {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #edc22e;
            border-radius: 3px;
            font-weight: bold;
            z-index: 10;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 150ms ease-in-out;
        }

        .tile.tile-2 { background: #eee4da; color: #776e65; }
        .tile.tile-4 { background: #ede0c8; color: #776e65; }
        .tile.tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile.tile-16 { background: #f59563; color: #f9f6f2; }
        .tile.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile.tile-128 { background: #edcf72; color: #095f6b; font-size: 30px; }
        .tile.tile-256 { background: #edcc61; color: #095f6b; font-size: 30px; }
        .tile.tile-512 { background: #edc850; color: #095f6b; font-size: 30px; }
        .tile.tile-1024 { background: #edc53f; color: #095f6b; font-size: 25px; }
        .tile.tile-2048 { background: #edc22e; color: #095f6b; font-size: 25px; }

        .tile.tile-super {
            background: #3c3322;
            color: #edc22e;
            font-size: 20px;
        }

        .tile-new {
            animation: pop 200ms ease-in-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .score-container {
            display: inline-block;
            background: #bbada0;
            padding: 15px 25px;
            border-radius: 3px;
            margin: 0 10px;
        }

        .score-container, .best-container {
            color: #eee4da;
            font-size: 16px;
        }

        .score {
            color: #776e65;
            font-size: 30px;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            background: #8f7a66;
            border: none;
            color: #f9f6f2;
            padding: 15px 30px;
            border-radius: 3px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #9f8a76;
        }
    </style>
</head>
<body>
    <div class="heading">
        <h1>2048</h1>
        <div class="score-container">Score: <span class="score">0</span></div>
        <div class="best-container">Best: <span class="score">0</span></div>
        <button onclick="location.reload()">New Game</button>
    </div>

    <div class="game-container">
        <div class="game-message">
            <p>Game Over!</p>
            <p class="lower">Game Over</p>
            <a href="javascript:location.reload()">Try again</a>
        </div>

        <div class="grid-container" id="grid">
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        </div>
    </div>

    <script>
        class Game {
            constructor() {
                this.grid = [];
                this.score = 0;
                this.won = false;
                this.gameOver = false;
                this.init();
                this.addKeyListener();
            }

            init() {
                this.grid = Array(16).fill(0);
                this.score = 0;
                this.won = false;
                this.gameOver = false;
                this.addNewTile();
                this.addNewTile();
                this.render();
            }

            addNewTile() {
                const empty = this.grid.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
                if (empty.length > 0) {
                    const idx = empty[Math.floor(Math.random() * empty.length)];
                    this.grid[idx] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            move(direction) {
                if (this.gameOver || this.won) return;

                const rotated = this.rotate(direction);
                let moved = false;

                for (let i = 0; i < 4; i++) {
                    const row = rotated.slice(i * 4, (i + 1) * 4);
                    const compressed = this.compress(row);
                    const merged = this.merge(compressed);
                    const newRow = this.compress(merged).concat(Array(4 - merged.length).fill(0));

                    for (let j = 0; j < 4; j++) {
                        if (rotated[i * 4 + j] !== newRow[j]) {
                            moved = true;
                        }
                        rotated[i * 4 + j] = newRow[j];
                    }
                }

                if (moved) {
                    this.grid = this.rotateBack(direction, rotated);
                    this.addNewTile();
                    this.updateScore();
                    this.checkGameState();
                    this.render();
                }
            }

            rotate(direction) {
                const grid = [...this.grid];
                if (direction === 'up') {
                    return [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15].map(i => grid[i]);
                } else if (direction === 'down') {
                    return [12, 8, 4, 0, 13, 9, 5, 1, 14, 10, 6, 2, 15, 11, 7, 3].map(i => grid[i]);
                } else if (direction === 'right') {
                    return [3, 2, 1, 0, 7, 6, 5, 4, 11, 10, 9, 8, 15, 14, 13, 12].map(i => grid[i]);
                }
                return grid;
            }

            rotateBack(direction, rotated) {
                if (direction === 'up') {
                    return [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15].map((i, idx) => rotated[idx]);
                } else if (direction === 'down') {
                    return [12, 8, 4, 0, 13, 9, 5, 1, 14, 10, 6, 2, 15, 11, 7, 3].map((i, idx) => rotated[idx]);
                } else if (direction === 'right') {
                    return [3, 2, 1, 0, 7, 6, 5, 4, 11, 10, 9, 8, 15, 14, 13, 12].map((i, idx) => rotated[idx]);
                }
                return rotated;
            }

            compress(row) {
                return row.filter(v => v !== 0);
            }

            merge(row) {
                for (let i = 0; i < row.length - 1; i++) {
                    if (row[i] === row[i + 1]) {
                        row[i] *= 2;
                        row.splice(i + 1, 1);
                        this.score += row[i];
                        if (row[i] === 2048) this.won = true;
                    }
                }
                return row;
            }

            updateScore() {
                document.querySelector('.score-container .score').textContent = this.score;
            }

            checkGameState() {
                const canMove = this.canMove();
                if (!canMove) {
                    this.gameOver = true;
                    document.querySelector('.game-message').classList.add('game-over');
                }
            }

            canMove() {
                for (let i = 0; i < 16; i++) {
                    if (this.grid[i] === 0) return true;
                }
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        const idx = i * 4 + j;
                        if (j < 3 && this.grid[idx] === this.grid[idx + 1]) return true;
                        if (i < 3 && this.grid[idx] === this.grid[idx + 4]) return true;
                    }
                }
                return false;
            }

            render() {
                const container = document.getElementById('grid');
                container.innerHTML = '';

                for (let i = 0; i < 4; i++) {
                    const row = document.createElement('div');
                    row.className = 'grid-row';
                    for (let j = 0; j < 4; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        row.appendChild(cell);
                    }
                    container.appendChild(row);
                }

                this.grid.forEach((value, idx) => {
                    if (value > 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${value}`;
                        tile.textContent = value;

                        const row = Math.floor(idx / 4);
                        const col = idx % 4;
                        tile.style.left = (col * 85 + 15) + 'px';
                        tile.style.top = (row * 85 + 15) + 'px';

                        container.appendChild(tile);
                    }
                });
            }

            addKeyListener() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.move('up');
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.move('down');
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.move('left');
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.move('right');
                    }
                });
            }
        }

        const game = new Game();
    </script>
</body>
</html>
