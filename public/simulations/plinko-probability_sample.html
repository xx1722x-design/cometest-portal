<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko Probability - PhET Interactive Simulations</title>
    <meta name="description" content="Explore probability through the Plinko board simulation">
    <meta property="og:title" content="Plinko Probability">
    <meta property="og:description" content="Interactive probability simulator based on the classic Plinko board game">
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plinko Probability Simulator</h1>
        <p>Drop balls through pegs and watch them fall into bins to explore probability distributions.</p>
        <canvas id="canvas" width="600" height="500"></canvas>
    </div>
    <script>
        // Sample canvas simulation (placeholder)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ddd';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Plinko Probability Board', canvas.width/2, canvas.height/2);
    </script>
</body>
</html>
