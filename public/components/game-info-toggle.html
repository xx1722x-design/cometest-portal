    <span class="toggle-icon">^</span>

  <!-- Info Panel -->

      <!-- Story Description -->
      <div class="game-info-section">

        </p>

</div>

<style>

  --toggle-btn-hover: rgba(157, 78, 221, 1);

  bottom: 0;
  right: 0;

  transition: max-height var(--transition-speed) ease-out;

}

  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--toggle-btn-bg);
  border: 2px solid var(--overlay-accent);
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  z-index: 9999;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  backdrop-filter: blur(10px);
}

.game-info-toggle-btn:hover {
  background: var(--toggle-btn-hover);
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
}

.game-info-toggle-btn:active {
  transform: scale(0.95);
}

.toggle-icon {
  display: inline-block;
  transition: transform 0.3s ease;
}

.game-info-overlay.active .toggle-icon {
  transform: rotate(180deg);
}

/* Info Panel */
.game-info-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  max-height: 60vh;
  background: var(--overlay-bg);
  border-top: 2px solid var(--overlay-border);
  border-radius: 20px 20px 0 0;
  overflow-y: auto;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  transform: translateY(100%);
  transition: transform var(--transition-speed) ease-out;
  box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);

@media (prefers-color-scheme: dark) {

  }

@media (prefers-color-scheme: light) {

    --toggle-btn-bg: rgba(124, 58, 237, 0.75);
    --toggle-btn-hover: rgba(124, 58, 237, 0.95);
  }

  .game-info-title {
    color: #1f1f3d;
  }

  .category-badge {

</style>

<script>
// Game Info Toggle Functionality
(function() {
  const toggle = document.getElementById('gameInfoToggle');
  const overlay = document.getElementById('gameInfoOverlay');
  const panel = document.getElementById('gameInfoPanel');

  // Toggle panel open/close
  if (toggle) {
    toggle.addEventListener('click', () => {
      overlay.classList.toggle('active');
    });
  }

  // Close on outside click
  document.addEventListener('click', (e) => {
    if (!overlay.contains(e.target) && !toggle.contains(e.target)) {
      if (overlay.classList.contains('active')) {
        overlay.classList.remove('active');
      }
    }
  });

  // Close on ESC key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('active')) {
      overlay.classList.remove('active');
    }
  });

  // Expose API for setting game info
  window.setGameInfo = function(gameData) {
    if (gameData.title) document.getElementById('gameTitle').textContent = gameData.title;
    if (gameData.story) document.getElementById('gameStory').textContent = gameData.story;
    if (gameData.controls) document.getElementById('gameControls').textContent = gameData.controls;

    if (gameData.category) {
      document.querySelector('.category-badge').textContent = gameData.category;
    }

    if (gameData.keywords && Array.isArray(gameData.keywords)) {
      const keywordsContainer = document.getElementById('gameKeywords');
      keywordsContainer.innerHTML = gameData.keywords
        .map(kw => `<span class="keyword-tag">${kw}</span>`)
        .join('');
    }
  };

  // Auto-populate from page data if available
  if (window.gameMetadata) {
    window.setGameInfo(window.gameMetadata);
  }
})();
</script>
